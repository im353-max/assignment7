jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t assignment7:latest .

      - name: Run container tests with pytest
        run: |
          # Run pytest inside the built Docker container
          docker run --rm assignment7:latest pytest -v